services:
  db:
    # PG19 + pgvector 0.8.7 + pg_textsearch 1.6.0 (BM25), built from docker/db/Dockerfile. Bump deliberately.
    build: ./docker/db
    image: fluxie-brain-db:pg19-pgvector0.8.7-pgts1.6.0
    # pg_textsearch must be preloaded; it registers its index access method at startup.
    command: ["postgres", "-c", "shared_preload_libraries=pg_textsearch"]
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      FLUXIE_MIGRATOR_PASSWORD: ${FLUXIE_MIGRATOR_PASSWORD:?set in .env}
      FLUXIE_APP_PASSWORD: ${FLUXIE_APP_PASSWORD:?set in .env}
    ports:
      # Bound to localhost only; never expose the database publicly.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Embeddings, CPU only everywhere (SPEC-embeddings.md). Limits mirror the target VPS share.
  ollama:
    image: ollama/ollama:0.40.18
    restart: unless-stopped
    cpus: 4
    mem_limit: 3g
    environment:
      # Keep the model loaded; the default unloads it after 5 idle minutes and the next search pays the load.
      OLLAMA_KEEP_ALIVE: "-1"
      # Only one model is ever in use; without this, every model tried stays loaded and the 3 GB fills up.
      OLLAMA_MAX_LOADED_MODELS: "1"
      # The model this service pulls. Its own variable: EMBEDDINGS_MODEL may name a remote model (openai/...) that
      # Ollama cannot pull. Keep it equal to EMBEDDINGS_MODEL when using the local provider.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-embeddinggemma-2:270m}
    # Pull the model inside the service so `up --wait` waits for it (a one-shot pull service counts as ready
    # while still downloading). Skip the pull when the model is already in the volume, so restarts work offline.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        ollama serve & pid=$$!;
        until ollama list >/dev/null 2>&1; do sleep 1; done;
        ollama show "$$OLLAMA_MODEL" >/dev/null 2>&1 || ollama pull "$$OLLAMA_MODEL" || exit 1;
        wait $$pid
    ports:
      # Bound to localhost only; Ollama has no authentication.
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      # Healthy only once the configured model is present.
      test: ["CMD-SHELL", 'ollama show "$$OLLAMA_MODEL" >/dev/null']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10m

volumes:
  pgdata:
  ollama-models:
