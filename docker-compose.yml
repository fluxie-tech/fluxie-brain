services:
  db:
    # PG19 + pgvector 0.8.7 (stable, built for PG19). Bump deliberately.
    image: pgvector/pgvector:0.8.7-pg19
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      FLUXIE_MIGRATOR_PASSWORD: ${FLUXIE_MIGRATOR_PASSWORD:?set in .env}
      FLUXIE_APP_PASSWORD: ${FLUXIE_APP_PASSWORD:?set in .env}
    ports:
      # Bound to localhost only; never expose the database publicly.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
